<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 280px; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    h3 { margin: 0 0 12px 0; font-size: 14px; }
    .btn {
      width: 100%; padding: 10px; margin: 6px 0; cursor: pointer;
      background: #229ED9; color: white; border: none; border-radius: 6px;
      font-size: 13px;
    }
    .btn:hover { background: #1a8ac4; }
    .btn.secondary { background: #f5f5f5; color: #333; }
    .btn.secondary:hover { background: #e5e5e5; }
    textarea {
      width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box;
      border: 1px solid #ddd; border-radius: 6px; font-size: 13px;
      resize: vertical; min-height: 80px;
    }
    #status { font-size: 12px; margin-top: 10px; text-align: center; }
    .error { color: #dc3545; }
    .success { color: #28a745; }
  </style>
</head>
<body>
  <h3>Telegram Saver</h3>

  <!-- 配置面板 -->
  <div id="configPanel">
    <input type="text" id="token" placeholder="Bot Token" style="width:100%;padding:8px;margin:4px 0;box-sizing:border-box;">
    <input type="text" id="chatId" placeholder="Chat ID 或 @频道名" style="width:100%;padding:8px;margin:4px 0;box-sizing:border-box;">
    <button class="btn secondary" id="saveConfig">保存配置</button>
  </div>

  <!-- 发送面板 -->
  <div id="sendPanel" style="display:none">
    <textarea id="message" placeholder="编辑消息内容"></textarea>
    <button class="btn" id="sendBtn">发送到 Telegram</button>
    <button class="btn secondary" id="editConfig">修改配置</button>
  </div>

  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
